<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="author" content="Prince Dube">
    <meta name="description" content="Product Review Form for WDD 131 Dynamic Web Fundamentals by Prince Dube,featuring responsive HTML, CSS, and JavaScript">

    <!--ADDING GOOGLE FONT JUST BEFORE THE CLOSING HEAD TAG-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/products.js" defer></script>
    <script src="scripts/form.js" defer></script>
   

</head>

<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="wf1">
        
        <label for="product">Product Name</label>
        <select id="product" name="product" required>
            <option value="" disabled selected>Select a Product...</option>
        </select>
        
        
        <fieldset class="ratings">
        <legend>Overall Rating</legend>
    <input type="radio" id="fivestar" name="rating" value="5" required>
    <label for="fivestar">*****</label>
    
    <input type="radio" id="fourstar" name="rating" value="4" required>
    <label for="fourstar">****</label>
    
    <input type="radio" id="threestar" name="rating" value="3" required>
    <label for="threestar">***</label>
    
    <input type="radio" id="twostar" name="rating" value="2" required>
    <label for="twostar">**</label>
    
    <input type="radio" id="onestar" name="rating" value="1" required>
    <label for="onestar">*</label>
        </fieldset>



        
        <label for="installDate">Date of Installation</label>
        <input type="date" id="installDate" name="installDate" required>
        

        <fieldset>
            <legend>Useful Features</legend>
        
            <input type="checkbox" id="durability" name="features" value="durability">
            <label for="durability">Durability</label>
        
            <input type="checkbox" id="performance" name="features" value="performance">
            <label for="performance">Performance</label>
        
            <input type="checkbox" id="design" name="features" value="design">
            <label for="design">Design</label>
        
            <input type="checkbox" id="ease" name="features" value="ease">
            <label for="ease">Ease of Use</label>
        </fieldset>


    
        <label for="review">Written Review (optional)</label>
        <textarea id="review" name="review"></textarea>
        

        
        <label for="username">Your Name (optional)</label>
        <input type="text" id="username" name="username">
        

        
        <input type="submit" value="Post Review">
    

        </form>
    </main>
    <footer>
        <p>&copy; &#127796; <span id="currentyear"></span> Prince Dube &#127796;Zimbabwe</p>
        <p><span id="lastModified"></span></p>
    </footer>
</body>
</html>
