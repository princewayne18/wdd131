<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="author" content="Prince Dube">
    <meta name="description" content="Product Review Form for WDD 131 Dynamic Web Fundamentals by Prince Dube,featuring responsive HTML, CSS, and JavaScript">

    <!--ADDING GOOGLE FONT JUST BEFORE THE CLOSING HEAD TAG-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <link rel="stylesheet" href="styles/form-normalise.css">
    <script src="scripts/products.js" defer></script>
    <script src="scripts/form.js" defer></script>
   

</head>

<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="wf1">
        
        <label for="product">Product Name</label>
        <select id="product" name="product" required>
            <option value="" disabled selected>Select a Product...</option>
        </select>
        
        
        <fieldset class="ratings">
            <legend>Overall Rating</legend>
            <label><input type="radio" id="ratings1"  name="rating" value="1" required>*</label>
            <label><input type="radio" id="ratings2"  name="rating" value="2">**</label>
            <label><input type="radio" id="ratings3"  name="rating" value="3">***</label>
            <label><input type="radio" id="ratings4"  name="rating" value="4">****</label>
            <label><input type="radio" id="ratings5"  name="rating" value="5">*****</label>

        </fieldset>

        
        <label for="installDate">Date of Installation</label>
        <input type="date" id="installDate" name="installDate" required>
        

        <fieldset>
            <legend>Useful Features</legend>
            <label><input type="checkbox" name="features" value="durability"> Durability</label>
            <label><input type="checkbox" name="features" value="performance"> Performance</label>
            <label><input type="checkbox" name="features" value="design"> Design</label>
            <label><input type="checkbox" name="features" value="ease"> Ease of Use</label>
        </fieldset>

    
        <label for="review">Written Review (optional)</label>
        <textarea id="review" name="review"></textarea>
        

        
        <label for="username">Your Name (optional)</label>
        <input type="text" id="username" name="username">
        

        
        <input type="submit" value="Post Review">
    

        </form>
    </main>
    <footer>
        <p>&copy; &#127796; <span id="currentyear"></span> Prince Dube &#127796;Zimbabwe</p>
        <p><span id="lastModified"></span></p>
    </footer>
</body>
</html>
