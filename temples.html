<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple and Albums</title>
    <meta name="author" content="Prince Dube">
    <meta name="description" content="Temple Album project for WDD 131 Dynamic Web Fundamentals by Prince Dube,
    featuring responsive HTML, CSS, and JavaScript">

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/temples.js" defer></script>

    <!--ADDING GOOGLE FONT JUST BEFORE THE CLOSING HEAD TAG-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>
<body>
    <header class="center">
        <p>Temple Album</p>
        <button type="button" id="menu"></button>
        <nav>
        <!--nav bar with text link  in unordered list-->
            <ul class="navigation">
                <li><a href="#">Home</a></li>
                <li><a href="#">Old</a></li>
                <li><a href="#">New</a></li>
                <li><a href="#">Large</a></li>
                <li><a href="#">Small</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Temple Photos</h1>

        <div class="container">
        <figure>
            <img class="hover" src="images/ivory-cost.webp" alt="Abidjan Ivory Coast Temple" height="200">
            <figcaption>Abidjan Ivory Coast Temple</figcaption>
        </figure>

        <figure>
            <img class="border-radius" src="images/ivory-cost.webp" alt="Acra Ghana Temple" height="200">
            <figcaption>Acra Ghana Temple</figcaption>
        </figure>
        
        <figure>
            <img class="opacity" src="images/ivory-cost.webp" alt="Aba Nigeria Temple" height="200">
            <figcaption>Aba Nigeria Temple</figcaption>
        </figure>

        <figure>
        <img class="blur" src="images/ivory-cost.webp" alt="Adelaide Australia Temple" height="200">
        <figcaption>Adelaide Australia Temple</figcaption>
        </figure>

        <figure>
            <img class="grayscale" src="images/ivory-cost.webp" alt="Apia Samoa Temple" height="200">
            <figcaption>Apia Samoa Temple</figcaption>
        </figure>

        <figure>
            <img class="contrast" src="images/ivory-cost.webp" alt="Bangkok Thailand Temple" height="200">
            <figcaption>Bangkok Thailand Temple</figcaption>
        </figure>

        <figure>
            <img class="saturate" src="images/ivory-cost.webp" alt="The Bountiful Utah Temple" height="200">
            <figcaption>The Bountiful Utah Temple</figcaption>
        </figure>

        <figure>
            <img class="horizontal" src="images/ivory-cost.webp" alt="Bern Switzerland Temple" height="200">
            <figcaption>Bern Switzerland Temple</figcaption>
        </figure>

        <figure>
            <img class="turn" src="images/ivory-cost.webp" alt="Bern Switzerland Temple" height="200">
            <figcaption>Belem Brazil Temple</figcaption>
        </figure>
       </div>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> Prince Dube Zimbabwe</p>
        <p><span id="lastModified"></span></p>
    </footer>
</body>
</html>
